name: Deploy mengyuanli.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-domain
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Mengyuan-L/mengyuanli.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check site sources
        run: python3 _tools/build.py --check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.repository == 'Mengyuan-L/mengyuanli.com'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
